<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Servana — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/styles.css">
  <style>
    /* ── Full-screen chat layout ── */
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    .chat-root {
      flex: 1;
      display: flex;
      overflow: hidden;
      min-height: 0;
    }

    /* ── Sidebar ── */
    .chat-sidebar {
      width: 300px;
      flex-shrink: 0;
      background: var(--bg-surface);
      border-right: .5px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    @media(max-width:639px){
      .chat-sidebar {
        width: 100%;
        position: absolute;
        top: var(--header-h, 60px);
        left: 0; right: 0; bottom: 0;
        z-index: 10;
        transition: transform .3s cubic-bezier(.25,.8,.25,1);
      }
      .chat-sidebar.slide-out { transform: translateX(-100%); }
    }

    .sidebar-head {
      padding: 14px 16px;
      border-bottom: .5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-title { font-family:'Orbitron',sans-serif; font-size:12px; font-weight:500; letter-spacing:.5px; color:var(--text-1); }

    .sidebar-search { padding: 10px 16px; border-bottom: .5px solid var(--border); flex-shrink: 0; }
    .ss-wrap { position: relative; }
    .ss-wrap svg { position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; stroke:var(--text-3); fill:none; stroke-width:2; stroke-linecap:round; }
    .ss-input { width:100%; padding:8px 12px 8px 34px; border:1px solid var(--border); border-radius:var(--r-sm); background:var(--bg-subtle); color:var(--text-1); font-family:'DM Sans',sans-serif; font-size:13px; outline:none; }
    .ss-input:focus { border-color: var(--accent); }

    .conv-list { flex:1; overflow-y:auto; }

    .conv-item { display:flex; align-items:center; gap:10px; padding:12px 16px; cursor:pointer; transition:background .15s; border-left:3px solid transparent; }
    .conv-item:hover { background: var(--bg-subtle); }
    .conv-item.active { background:rgba(26,35,126,.06); border-left-color:var(--brand); }
    .conv-av { width:40px; height:40px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; font-weight:700; flex-shrink:0; position:relative; }
    .conv-online { position:absolute; bottom:1px; right:1px; width:10px; height:10px; border-radius:50%; background:var(--success); border:1.5px solid var(--bg-surface); }
    .conv-info { flex:1; min-width:0; }
    .conv-name { font-size:13px; font-weight:600; color:var(--text-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .conv-preview { font-size:11px; color:var(--text-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
    .conv-meta { display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex-shrink:0; }
    .conv-time { font-size:10px; color:var(--text-3); }
    .conv-unread { width:18px; height:18px; border-radius:50%; background:var(--accent); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; }

    /* ── Chat view ── */
    .chat-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      background: var(--bg-page);
    }

    /* Empty state */
    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-3);
      padding: 20px;
      text-align: center;
    }
    .chat-empty svg { width:48px; height:48px; stroke:var(--text-3); fill:none; stroke-width:1.2; opacity:.4; }

    /* Active chat wrapper — fills remaining space */
    .active-chat {
      display: none;          /* JS sets to flex when a conv is selected */
      flex-direction: column;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    .active-chat.visible { display: flex; }

    /* Chat header */
    .chat-view-head {
      background: var(--bg-surface);
      border-bottom: .5px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-view-av { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:12px; font-weight:700; flex-shrink:0; }
    .chat-view-name { font-size:14px; font-weight:700; color:var(--text-1); }
    .chat-view-status { font-size:11px; color:var(--success); margin-top:1px; }
    .back-mobile { display:none; width:32px; height:32px; border-radius:50%; background:none; border:1px solid var(--border); cursor:pointer; color:var(--text-2); align-items:center; justify-content:center; transition:background .15s; flex-shrink:0; }
    .back-mobile svg { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; }
    @media(max-width:639px){ .back-mobile { display:flex; } }

    /* Messages area — grows to fill, scrolls internally */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scroll-behavior: smooth;
      min-height: 0;
    }

    .msg-date-sep { text-align:center; font-size:11px; color:var(--text-3); font-weight:500; padding:6px 0; }
    .msg-row { display:flex; align-items:flex-end; gap:8px; }
    .msg-row.mine { flex-direction:row-reverse; }
    .msg-av-sm { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,var(--brand),var(--accent)); display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; flex-shrink:0; }
    .msg-bubble { max-width:72%; padding:10px 14px; border-radius:16px; font-size:13px; line-height:1.5; word-break:break-word; }
    .msg-bubble.them { background:var(--bg-surface); border:.5px solid var(--border); color:var(--text-1); border-bottom-left-radius:4px; }
    .msg-bubble.mine { background:linear-gradient(135deg,var(--brand),var(--accent)); color:#fff; border-bottom-right-radius:4px; }
    .msg-time { font-size:10px; color:rgba(255,255,255,.6); margin-top:4px; text-align:right; }
    .msg-bubble.them .msg-time { color:var(--text-3); }

    /* ── Composer — ALWAYS at bottom, NEVER disappears ── */
    .chat-composer {
      background: var(--bg-surface);
      border-top: .5px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;           /* CRITICAL: never compress */
      /* Safe area for mobile notch/bar */
      padding-bottom: max(12px, env(safe-area-inset-bottom, 12px));
    }
    .composer-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-subtle);
      padding: 10px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-1);
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      transition: border-color .2s;
    }
    .composer-input:focus { border-color: var(--accent); }
    .composer-input::placeholder { color: var(--text-3); }
    .send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 3px 10px rgba(108,60,225,.3);
    }
    .send-btn:hover { opacity: .88; }
    .send-btn:active { transform: scale(.94); }
    .send-btn svg { width:18px; height:18px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .send-btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Skeletons */
    .skel { background:var(--border); border-radius:8px; animation:shimmer 1.5s infinite; }
    @keyframes shimmer{0%,100%{opacity:.6}50%{opacity:.3}}
  </style>
</head>
<body>
<div id="toast-container"></div>
<div id="spinner-overlay"><div class="spinner-ring"></div></div>

<!-- Header -->
<header class="header">
  <a href="./dashboard.html" class="header-back">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
  <div class="header-title">MESSAGES<span>Chat with providers &amp; seekers</span></div>
  <button class="hdr-btn" id="newChatBtn" aria-label="New chat" title="New chat">
    <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>
</header>

<!-- Chat root -->
<div class="chat-root">

  <!-- Sidebar -->
  <div class="chat-sidebar" id="chatSidebar">
    <div class="sidebar-head">
      <span class="sidebar-title">Conversations</span>
      <span class="sec-pill" id="convCount" style="font-size:11px;font-weight:700;padding:2px 8px;background:rgba(108,60,225,.1);color:var(--accent);border-radius:10px">0</span>
    </div>
    <div class="sidebar-search">
      <div class="ss-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="ss-input" type="search" id="convSearch" placeholder="Search conversations…">
      </div>
    </div>
    <div class="conv-list" id="convList">
      <div style="padding:14px;display:flex;flex-direction:column;gap:10px">
        <div class="skel" style="height:52px"></div>
        <div class="skel" style="height:52px"></div>
        <div class="skel" style="height:52px"></div>
      </div>
    </div>
  </div>

  <!-- Chat view -->
  <div class="chat-view">

    <!-- Empty state (no conversation selected) -->
    <div class="chat-empty" id="chatEmpty">
      <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
      <p style="font-size:14px;font-weight:600;color:var(--text-2)">Select a conversation</p>
      <p style="font-size:12px">Choose from your chats to start messaging</p>
    </div>

    <!-- Active conversation -->
    <div class="active-chat" id="activeChat">

      <!-- Conversation header -->
      <div class="chat-view-head">
        <button class="back-mobile" id="backBtn">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="chat-view-av" id="chatAv"></div>
        <div>
          <div class="chat-view-name" id="chatName">—</div>
          <div class="chat-view-status">● Online</div>
        </div>
      </div>

      <!-- Messages -->
      <div class="messages-area" id="messagesArea"></div>

      <!-- Composer — always rendered, never hidden -->
      <div class="chat-composer">
        <textarea
          class="composer-input"
          id="msgInput"
          placeholder="Type a message…"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send message">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>

    </div>

  </div><!-- /chat-view -->
</div><!-- /chat-root -->

<script type="module">
import { auth, db, toast, esc, initials } from "./assets/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  collection, doc, query, where, limit,
  onSnapshot, addDoc, updateDoc, serverTimestamp,
  getDocs, getDoc, setDoc, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let me = null, activeChatId = null, unsubMessages = null;
let allConvs = [];

// ── Auth ─────────────────────────────────────────────
onAuthStateChanged(auth, user => {
  if (!user) { location.href = "./login.html"; return; }
  me = user;
  listenConversations();
  // Deep link: ?uid=xxx starts chat with that user
  const uid = new URLSearchParams(location.search).get("uid");
  if (uid) setTimeout(() => startChatWith(uid), 1000);
});

// ── Listen to conversations ──────────────────────────
function listenConversations() {
  const q = query(
    collection(db, "chats"),
    where("participants", "array-contains", me.uid)
  );
  onSnapshot(q, snap => {
    allConvs = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.lastMessageAt?.seconds||0) - (a.lastMessageAt?.seconds||0));
    $("convCount").textContent = allConvs.length;
    renderConvList();
  }, err => {
    console.error("[Chat] Conversations error:", err);
    $("convList").innerHTML = `
      <div style="padding:24px;text-align:center">
        <div style="font-size:28px;margin-bottom:8px">💬</div>
        <p style="font-size:13px;font-weight:600;color:var(--text-2)">No conversations yet</p>
        <p style="font-size:11px;color:var(--text-3);margin-top:4px">Book a service to start chatting.</p>
      </div>`;
  });
}

function renderConvList(filter = "") {
  const list = filter
    ? allConvs.filter(c => getOtherName(c).toLowerCase().includes(filter.toLowerCase()))
    : allConvs;

  if (!list.length) {
    $("convList").innerHTML = `
      <div style="padding:24px;text-align:center">
        <div style="font-size:28px;margin-bottom:8px">💬</div>
        <p style="font-size:13px;font-weight:600;color:var(--text-2)">No conversations yet</p>
        <p style="font-size:11px;color:var(--text-3);margin-top:4px">Book a service to start chatting.</p>
      </div>`;
    return;
  }

  $("convList").innerHTML = list.map(c => {
    const name    = getOtherName(c);
    const preview = c.lastMessage || "Say hello 👋";
    const time    = c.lastMessageAt?.toDate?.()?.toLocaleTimeString("en-NG", { hour:"2-digit", minute:"2-digit" }) || "";
    const unread  = c.unread?.[me.uid] || 0;
    return `
    <div class="conv-item ${c.id === activeChatId ? "active" : ""}" data-id="${c.id}" data-name="${esc(name)}">
      <div class="conv-av">${initials(name)}<div class="conv-online"></div></div>
      <div class="conv-info">
        <div class="conv-name">${esc(name)}</div>
        <div class="conv-preview">${esc(preview)}</div>
      </div>
      <div class="conv-meta">
        <span class="conv-time">${time}</span>
        ${unread > 0 ? `<span class="conv-unread">${unread}</span>` : ""}
      </div>
    </div>`;
  }).join("");

  $("convList").querySelectorAll(".conv-item").forEach(item => {
    item.addEventListener("click", () => openChat(item.dataset.id, item.dataset.name));
  });
}

function getOtherName(conv) {
  if (!conv.participantNames) return "User";
  const otherUid = (conv.participants || []).find(uid => uid !== me.uid);
  return conv.participantNames?.[otherUid] || "User";
}

// ── Search ───────────────────────────────────────────
$("convSearch").addEventListener("input", e => renderConvList(e.target.value));

// ── Open conversation ────────────────────────────────
async function openChat(chatId, partnerName) {
  if (activeChatId === chatId) return;
  activeChatId = chatId;

  // Update UI
  $("chatEmpty").style.display = "none";
  $("activeChat").classList.add("visible");
  $("chatName").textContent = partnerName;
  $("chatAv").textContent   = initials(partnerName);

  // Mark as read
  try {
    await updateDoc(doc(db, "chats", chatId), { [`unread.${me.uid}`]: 0 });
  } catch {}

  // Highlight conv item
  $("convList").querySelectorAll(".conv-item").forEach(i =>
    i.classList.toggle("active", i.dataset.id === chatId)
  );

  // Mobile: slide sidebar out
  if (window.innerWidth < 640) $("chatSidebar").classList.add("slide-out");

  // Show loading
  $("messagesArea").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:8px;padding:8px">
      <div class="skel" style="height:40px;width:60%;border-radius:12px;margin-left:40%"></div>
      <div class="skel" style="height:40px;width:55%;border-radius:12px"></div>
      <div class="skel" style="height:40px;width:70%;border-radius:12px;margin-left:30%"></div>
    </div>`;

  // Unsubscribe previous
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }

  // Listen to messages — no orderBy (sorted client-side to avoid index requirement)
  const q = query(
    collection(db, "chats", chatId, "messages"),
    limit(150)
  );
  unsubMessages = onSnapshot(q, snap => {
    const msgs = snap.docs
      .map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
    renderMessages(msgs);
  });

  // Focus input
  setTimeout(() => $("msgInput").focus(), 100);
}

function renderMessages(messages) {
  const area = $("messagesArea");
  if (!messages.length) {
    area.innerHTML = `<div class="msg-date-sep">Say hello! 👋 Be the first to send a message.</div>`;
    return;
  }

  let lastDate = "";
  area.innerHTML = messages.map(m => {
    const mine    = m.senderId === me.uid;
    const time    = m.createdAt?.toDate?.()?.toLocaleTimeString("en-NG", { hour:"2-digit", minute:"2-digit" }) || "";
    const dateStr = m.createdAt?.toDate?.()?.toLocaleDateString("en-NG", { month:"short", day:"numeric" }) || "";
    let sep = "";
    if (dateStr && dateStr !== lastDate) {
      lastDate = dateStr;
      sep = `<div class="msg-date-sep">${dateStr}</div>`;
    }
    return `${sep}
    <div class="msg-row ${mine ? "mine" : ""}">
      ${!mine ? `<div class="msg-av-sm">${initials(m.senderName || "U")}</div>` : ""}
      <div class="msg-bubble ${mine ? "mine" : "them"}">
        ${esc(m.text || "")}
        <div class="msg-time">${time}${mine ? " ✓" : ""}</div>
      </div>
    </div>`;
  }).join("");

  // Scroll to bottom
  area.scrollTop = area.scrollHeight;
}

// ── Send message ─────────────────────────────────────
async function sendMessage() {
  const text = $("msgInput").value.trim();
  if (!text || !activeChatId) return;
  $("msgInput").value = "";
  $("msgInput").style.height = "auto";

  try {
    await addDoc(collection(db, "chats", activeChatId, "messages"), {
      senderId:   me.uid,
      senderName: me.displayName || "User",
      text,
      createdAt:  serverTimestamp(),
      read:       false
    });
    await updateDoc(doc(db, "chats", activeChatId), {
      lastMessage:   text,
      lastMessageAt: serverTimestamp()
    });
  } catch(e) {
    console.error("[Chat] Send error:", e);
    toast("Failed to send message.", "error");
    $("msgInput").value = text;
  }
}

$("sendBtn").addEventListener("click", sendMessage);

$("msgInput").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// Auto-resize textarea
$("msgInput").addEventListener("input", () => {
  const el = $("msgInput");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
});

// ── Mobile back ──────────────────────────────────────
$("backBtn").addEventListener("click", () => {
  $("chatSidebar").classList.remove("slide-out");
  $("activeChat").classList.remove("visible");
  $("chatEmpty").style.display = "flex";
  activeChatId = null;
  if (unsubMessages) { unsubMessages(); unsubMessages = null; }
});

// ── Start chat from deep link (?uid=xxx) ─────────────
async function startChatWith(otherUid) {
  if (!me) return;
  try {
    // Check for existing chat
    const q    = query(collection(db, "chats"), where("participants", "array-contains", me.uid));
    const snap = await getDocs(q);
    let chatId = null;
    snap.docs.forEach(d => {
      if ((d.data().participants || []).includes(otherUid)) chatId = d.id;
    });

    if (!chatId) {
      const otherSnap = await getDoc(doc(db, "users", otherUid));
      const otherName = otherSnap.exists() ? (otherSnap.data().displayName || "User") : "User";
      const ref = await addDoc(collection(db, "chats"), {
        participants:     [me.uid, otherUid],
        participantNames: { [me.uid]: me.displayName || "User", [otherUid]: otherName },
        lastMessage:      "",
        lastMessageAt:    serverTimestamp(),
        unread:           { [me.uid]: 0, [otherUid]: 0 }
      });
      chatId = ref.id;
    }

    const conv = allConvs.find(c => c.id === chatId);
    const name = conv ? getOtherName(conv) : "User";
    openChat(chatId, name);
  } catch(e) {
    console.error("[Chat] startChatWith error:", e);
  }
}
</script>
</body>
</html>
