<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Servana — Find a Service</title>
  <noscript><meta http-equiv="refresh" content="0;url=./seeker.html"/></noscript>
</head>
<body>
<!--
  Legacy URL. Category browsing now lives in seeker.html, so listings, prices,
  availability and service areas are decided by ONE matching engine (assets/matching.js).
  Old links such as category.html?cat=Plumbers keep working via this redirect.
-->
<p style="font-family:system-ui,sans-serif;padding:24px">Redirecting… <a href="./seeker.html">Continue</a></p>
<script>
  (function () {
    var cat = new URLSearchParams(location.search).get("cat") || "";
    var id  = cat.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    location.replace("./seeker.html" + (id ? "?category=" + encodeURIComponent(id) : ""));
  })();
</script>
</body>
</html>
