# ═══════════════════════════════════════════════════════
# SERVANA — Netlify Configuration
# Production Configuration
# ═══════════════════════════════════════════════════════

[build]
  # Where your HTML files live
  publish = "."

  # Netlify serverless functions
  functions = "netlify/functions"


# ───────────────────────────────────────────────────────
# SPA FALLBACK
# ───────────────────────────────────────────────────────
# Allows client-side routes to resolve through index.html
# while preserving the existing Servana application flow.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# ───────────────────────────────────────────────────────
# GLOBAL SECURITY HEADERS
# ───────────────────────────────────────────────────────

[[headers]]
  for = "/*"

  [headers.values]

    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Browser permissions
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

    # ───────────────────────────────────────────────────
    # CONTENT SECURITY POLICY
    # ───────────────────────────────────────────────────
    #
    # Firebase / Google authentication
    # Paystack
    # OneSignal
    # Cloudinary
    # EmailJS
    # Google Fonts
    #
    Content-Security-Policy = """
      default-src 'self';

      script-src 'self' 'unsafe-inline'
                  https://www.gstatic.com
                  https://apis.google.com
                  https://www.googleapis.com
                  https://cdn.jsdelivr.net
                  https://js.paystack.co
                  https://cdn.onesignal.com;

      style-src 'self' 'unsafe-inline'
                  https://fonts.googleapis.com;

      font-src 'self'
                https://fonts.gstatic.com;

      img-src 'self' data: blob:
                https://res.cloudinary.com
                https://firebasestorage.googleapis.com
                  https://lh3.googleusercontent.com;

      connect-src 'self'
                  https://*.firebaseio.com
                  https://*.firebaseapp.com
                  https://*.googleapis.com
                  https://api.cloudinary.com
                  https://onesignal.com
                  https://api.onesignal.com
                  https://api.emailjs.com
                  https://cdn.jsdelivr.net;

      frame-src 'self'
                https://*.firebaseapp.com
                https://*.firebase.com
                https://accounts.google.com
                https://js.paystack.co;

      object-src 'none';

      base-uri 'self';

      form-action 'self'
                  https://accounts.google.com
                  https://checkout.paystack.com;
    """


# ───────────────────────────────────────────────────────
# STATIC ASSET CACHING
# ───────────────────────────────────────────────────────
# Cache normal assets aggressively for performance.
#
# IMPORTANT:
# Specific files that change frequently are overridden below.

[[headers]]
  for = "/assets/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[[headers]]
  for = "/assets/images/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# ───────────────────────────────────────────────────────
# CLOUDINARY MODULE
# ───────────────────────────────────────────────────────
# Do NOT aggressively cache this file.
#
# This ensures fixes to uploadToCloudinary(),
# serviceImageUrl(), avatarUrl(), etc. reach users
# immediately after deployment.

[[headers]]
  for = "/assets/cloudinary.js"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"


# ───────────────────────────────────────────────────────
# HTML PAGES
# ───────────────────────────────────────────────────────
# Always fetch the latest HTML so users receive
# the newest application version and module references.

[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"


# ───────────────────────────────────────────────────────
# SERVICE WORKER
# ───────────────────────────────────────────────────────
# Service workers must always be checked for updates.

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"