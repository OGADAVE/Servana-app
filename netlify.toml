# ═══════════════════════════════════════════════════════
# SERVANA — Netlify Configuration
# ═══════════════════════════════════════════════════════

[build]
  # Where your HTML files live
  publish = "."

  # Netlify serverless functions
  functions = "netlify/functions"


# ───────────────────────────────────────────────────────
# NO SPA FALLBACK
# ───────────────────────────────────────────────────────
# Servana is a multi-page app. The old catch-all (/* -> /index.html, 200) turned every
# mistyped URL into a "successful" home page (soft 404s, confusing for users and Google)
# and hid broken links. Netlify now serves 404.html for unknown paths. Pretty URLs such as
# /login and /support still resolve to login.html and support.html.


# ───────────────────────────────────────────────────────
# GLOBAL SECURITY HEADERS
# ───────────────────────────────────────────────────────

[[headers]]
  for = "/*"

  [headers.values]

    # Prevent clickjacking
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    
    # Enforce HTTPS in browsers
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # Control referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Browser permissions
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

    # ───────────────────────────────────────────────────
    # CONTENT SECURITY POLICY
    # ───────────────────────────────────────────────────
    #
    # Firebase / Google authentication
    # Paystack
    # OneSignal
    # Cloudinary
    # EmailJS
    # Google Fonts
    #
    Content-Security-Policy = """
      default-src 'self';

      script-src 'self' 'unsafe-inline'
                  https://www.gstatic.com
                  https://apis.google.com
                  https://www.googleapis.com
                  https://cdn.jsdelivr.net
                  https://js.paystack.co
                  https://cdn.onesignal.com;

      style-src 'self' 'unsafe-inline'
                  https://fonts.googleapis.com;

      font-src 'self'
                https://fonts.gstatic.com;

      img-src 'self' data: blob:
                https://res.cloudinary.com
                https://firebasestorage.googleapis.com
                  https://lh3.googleusercontent.com;

      connect-src 'self'
                  https://*.firebaseio.com
                  https://*.firebaseapp.com
                  https://*.googleapis.com
                  https://api.cloudinary.com
                  https://onesignal.com
                  https://api.onesignal.com
                  https://api.emailjs.com
                  https://api.paystack.co
                  https://checkout.paystack.com
                  https://cdn.jsdelivr.net;

      frame-src 'self'
                https://*.firebaseapp.com
                https://auth.servana.top
                https://*.firebase.com
                https://accounts.google.com
                https://js.paystack.co
                https://checkout.paystack.com;

      object-src 'none';

      base-uri 'self';

      form-action 'self'
                  https://accounts.google.com
                  https://checkout.paystack.com;
    """


# ───────────────────────────────────────────────────────
# STATIC ASSET CACHING
# ───────────────────────────────────────────────────────
# Cache normal assets aggressively for performance.
#
# IMPORTANT:
# Specific files that change frequently are overridden below.

# Code (JS/CSS) is NOT fingerprinted, so it must be revalidated on every load (cheap 304s).
# "immutable for a year" meant returning users kept running old matching/booking/payment code.
[[headers]]
  for = "/assets/*.js"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


[[headers]]
  for = "/assets/*.css"

  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"


# Images never change in place.
[[headers]]
  for = "/assets/images/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# ───────────────────────────────────────────────────────
# HTML PAGES
# ───────────────────────────────────────────────────────
# Always fetch the latest HTML so users receive
# the newest application version and module references.

[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"


# ───────────────────────────────────────────────────────
# SERVICE WORKER
# ───────────────────────────────────────────────────────
# Service workers must always be checked for updates.

[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"