# ═══════════════════════════════════════════════════════
# SERVANA — Netlify Configuration
# ═══════════════════════════════════════════════════════

[build]
  # Where your HTML files live
  publish = "."
  # Netlify auto-detects the functions folder
  functions = "netlify/functions"

# ── Redirect all unknown paths to index.html (SPA behaviour) ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers on every page ───────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options         = "DENY"
    X-Content-Type-Options  = "nosniff"
    Referrer-Policy         = "strict-origin-when-cross-origin"
    Permissions-Policy      = "camera=(), microphone=(), geolocation=(self)"
    # Content Security Policy
    # Adjust if you add more external scripts
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self' 'unsafe-inline'
                  https://www.gstatic.com
                  https://cdn.jsdelivr.net
                  https://js.paystack.co
                  https://cdn.onesignal.com
                  https://www.googleapis.com;
      style-src   'self' 'unsafe-inline'
                  https://fonts.googleapis.com;
      font-src    'self'
                  https://fonts.gstatic.com;
      img-src     'self' data: blob:
                  https://res.cloudinary.com
                  https://firebasestorage.googleapis.com;
      connect-src 'self'
                  https://*.firebaseio.com
                  https://*.googleapis.com
                  https://api.cloudinary.com
                  https://onesignal.com
                  https://api.emailjs.com
                  https://cdn.jsdelivr.net;
      frame-src   'none';
    """

# ── Cache static assets aggressively ─────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Never cache HTML pages ────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Service worker must never be cached ───────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
